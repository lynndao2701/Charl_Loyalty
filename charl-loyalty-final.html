<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Charl Nails &amp; Wellness — Loyalty</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root{
  --cream:#faf5f1; --card:#ffffff; --ink:#3b3336; --ink-soft:#8a7f82;
  --rose:#b76e79; --rose-deep:#9c5a64; --rose-tint:#f3e3e5;
  --sage:#889a80; --sage-deep:#6f7d68; --sage-tint:#e8ede4;
  --gold:#c9a24b; --line:#eaddd9; --shadow:0 8px 30px rgba(120,80,85,.10); --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Jost',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 60px;min-height:100%}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1.15}
.hidden{display:none !important}
.app-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;flex-direction:column}
.brand .name{font-family:'Cormorant Garamond',serif;font-size:1.55rem;color:var(--rose-deep);letter-spacing:.3px}
.brand .sub{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft)}
.logout{background:none;border:1px solid var(--line);color:var(--ink-soft);font-family:inherit;font-size:.8rem;padding:8px 14px;border-radius:999px;cursor:pointer}
.logout:active{background:var(--rose-tint)}
.btn{font-family:inherit;font-size:1rem;font-weight:500;border:none;border-radius:14px;padding:15px 18px;cursor:pointer;width:100%;transition:transform .05s ease,filter .15s ease}
.btn:active{transform:scale(.99)}
.btn-primary{background:var(--rose);color:#fff}
.btn-primary:active{filter:brightness(.95)}
.btn-sage{background:var(--sage);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-sm{width:auto;padding:11px 16px;font-size:.9rem}
label.fld{display:block;font-size:.8rem;color:var(--ink-soft);margin:14px 0 6px;letter-spacing:.3px}
input[type=text],input[type=tel],input[type=password]{width:100%;font-family:inherit;font-size:1.05rem;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:transparent}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.login-wrap{min-height:78vh;display:flex;flex-direction:column;justify-content:center}
.login-mark{text-align:center;margin-bottom:26px}
.login-mark .ring{width:66px;height:66px;border-radius:50%;margin:0 auto 14px;background:radial-gradient(circle at 30% 30%,var(--rose-tint),var(--rose));box-shadow:inset 0 0 0 4px #fff, var(--shadow)}
.login-mark h1{font-size:2rem;color:var(--rose-deep)}
.login-mark p{font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
.searchbar{display:flex;gap:10px;margin-bottom:8px}
.searchbar input{flex:1}
.add-btn{flex:0 0 auto;width:54px;height:54px;border-radius:14px;border:none;background:var(--sage);color:#fff;font-size:1.7rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add-btn:active{filter:brightness(.95)}
.hint{font-size:.82rem;color:var(--ink-soft);margin:6px 2px 18px}
.result{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.result:active{background:var(--rose-tint)}
.result .who{display:flex;flex-direction:column}
.result .who .nm{font-size:1.05rem;font-weight:500}
.result .who .ph{font-size:.82rem;color:var(--ink-soft)}
.result .pill{font-size:.78rem;background:var(--sage-tint);color:var(--sage-deep);padding:5px 11px;border-radius:999px;white-space:nowrap;font-weight:500}
.result .pill.ready{background:var(--rose-tint);color:var(--rose-deep)}
.empty{text-align:center;padding:30px 10px;color:var(--ink-soft)}
.empty strong{color:var(--ink)}
.back{background:none;border:none;color:var(--rose-deep);font-family:inherit;font-size:.95rem;cursor:pointer;padding:6px 0;margin-bottom:10px}
.cust-name{font-size:1.9rem;color:var(--ink)}
.cust-phone{color:var(--ink-soft);margin-bottom:4px}
.cust-meta{font-size:.8rem;color:var(--ink-soft);margin-bottom:12px}
.last-visit{font-size:.85rem;background:var(--sage-tint);color:var(--sage-deep);padding:9px 13px;border-radius:12px;margin-bottom:18px}
.last-visit b{color:var(--sage-deep)}
.last-visit.muted{background:#f4efec;color:var(--ink-soft)}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:8px 0 6px}
.stamp-cell{display:flex;flex-direction:column;align-items:center;gap:5px}
.stamp{width:100%;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:var(--ink-soft);cursor:pointer;background:#fff;transition:transform .12s ease,background .12s ease}
.stamp:active{transform:scale(.92)}
.stamp.filled{border:2px solid var(--rose);background:radial-gradient(circle at 32% 28%,var(--rose-tint),var(--rose));border-style:solid}
.stamp.tenth{border-color:var(--gold)}
.stamp.tenth.filled{background:radial-gradient(circle at 32% 28%,#f6e6b8,var(--gold));border-color:var(--gold)}
.stamp .num{font-size:.75rem;opacity:.6}
.stamp-date{font-size:.6rem;color:var(--ink-soft);line-height:1;min-height:.75rem;letter-spacing:.2px}
.count-line{text-align:center;font-size:.9rem;color:var(--ink-soft);margin:14px 0 18px}
.count-line b{color:var(--rose-deep);font-size:1.05rem}
.stamp-actions{display:flex;gap:10px;margin-bottom:8px}
.stamp-actions .btn{flex:1}
.reward{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;border-radius:var(--radius);padding:22px;text-align:center;margin:6px 0 16px;box-shadow:var(--shadow)}
.reward h3{font-size:1.7rem;margin-bottom:4px}
.reward p{opacity:.92;font-size:.9rem;margin-bottom:16px}
.reward .btn{background:#fff;color:var(--rose-deep);font-weight:600}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--sage-deep);color:#fff;padding:13px 22px;border-radius:999px;font-size:.9rem;box-shadow:var(--shadow);opacity:0;transition:all .25s ease;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.errbox{background:#fff3f2;border:1px solid #f0c9c4;color:#9c3b32;padding:14px 16px;border-radius:14px;font-size:.9rem;margin-bottom:14px}
.spin{text-align:center;color:var(--ink-soft);padding:30px}
</style>
</head>
<body>

<!-- CONFIG — fill in SUPABASE_URL and SUPABASE_ANON_KEY (see setup notes) -->
<script>
const CONFIG = {
  SUPABASE_URL:  "https://zctlxkubbucsztkbwlkj.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjdGx4a3ViYnVjc3p0a2J3bGtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDExMDUsImV4cCI6MjEwMzMxNzEwNX0.HGk2RWEpZkB5juDulq0gBFYU0Fxu17WLWWtu_WegxS0",
  LOGIN_DOMAIN: "charlnails.app",
  STAMPS_FOR_REWARD: 10,
  REWARD_LABEL: "40% off this visit",
  STAMP_ICON: "💅",   // <-- change this emoji if you want a different stamp (e.g. 🌸 🌹 💖)
};
</script>

<div class="wrap">

  <section id="loginScreen" class="login-wrap">
    <div class="login-mark">
      <div class="ring"></div>
      <h1>Charl Nails &amp; Wellness</h1>
      <p>Loyalty &middot; Staff sign-in</p>
    </div>
    <div class="panel">
      <div id="loginError" class="errbox hidden"></div>
      <label class="fld" for="loginPhone">Shop phone number</label>
      <input id="loginPhone" type="tel" inputmode="numeric" autocomplete="username" placeholder="e.g. 0400 000 000" />
      <label class="fld" for="loginPass">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="Password" />
      <div style="height:18px"></div>
      <button id="loginBtn" class="btn btn-primary">Sign in</button>
    </div>
  </section>

  <section id="appScreen" class="hidden">
    <div class="app-head">
      <div class="brand">
        <span class="name">Charl Nails &amp; Wellness</span>
        <span class="sub">Loyalty</span>
      </div>
      <button id="logoutBtn" class="logout">Sign out</button>
    </div>

    <div id="searchView">
      <div class="searchbar">
        <input id="searchInput" type="text" placeholder="Search customer name…" autocomplete="off" />
        <button id="addOpenBtn" class="add-btn" title="Add new customer">+</button>
      </div>
      <p class="hint">Search by first or last name. No match? Tap <b>+</b> to add a new customer.</p>
      <div id="results"></div>
    </div>

    <div id="addView" class="hidden">
      <button class="back" id="addBack">&larr; Back to search</button>
      <div class="panel">
        <h2 style="font-size:1.5rem;margin-bottom:4px">New customer</h2>
        <div id="addError" class="errbox hidden"></div>
        <label class="fld" for="addFirst">First name <span style="color:var(--rose)">*</span></label>
        <input id="addFirst" type="text" placeholder="First name" />
        <label class="fld" for="addLast">Last name (optional)</label>
        <input id="addLast" type="text" placeholder="Last name" />
        <label class="fld" for="addPhone">Phone number (optional)</label>
        <input id="addPhone" type="tel" inputmode="numeric" placeholder="Phone" />
        <div style="height:20px"></div>
        <button id="addSaveBtn" class="btn btn-sage">Save customer</button>
      </div>
    </div>

    <div id="custView" class="hidden">
      <button class="back" id="custBack">&larr; Back to search</button>
      <div id="custBody"></div>
    </div>
  </section>

</div>

<div id="toast" class="toast"></div>

<script>
let sb, current=null;
const $ = (id)=>document.getElementById(id);

async function boot(){
  try{
    if(CONFIG.SUPABASE_URL.includes("YOUR-PROJECT-REF") || CONFIG.SUPABASE_ANON_KEY.includes("YOUR-")){
      throw new Error("Setup not finished: add your Supabase URL and anon key in the CONFIG block near the top of the file.");
    }
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data:{ session } } = await sb.auth.getSession();
    if(session) showApp(); else showLogin();
  }catch(err){
    showLogin(); showLoginError(err.message || String(err));
  }
}

function showLogin(){ $("loginScreen").classList.remove("hidden"); $("appScreen").classList.add("hidden"); }
function showApp(){ $("loginScreen").classList.add("hidden"); $("appScreen").classList.remove("hidden"); goSearch(); $("searchInput").value=""; $("results").innerHTML=""; }
function goSearch(){ $("searchView").classList.remove("hidden"); $("addView").classList.add("hidden"); $("custView").classList.add("hidden"); }
function goAdd(){ $("searchView").classList.add("hidden"); $("addView").classList.remove("hidden"); $("custView").classList.add("hidden"); }
function goCust(){ $("searchView").classList.add("hidden"); $("addView").classList.add("hidden"); $("custView").classList.remove("hidden"); }
function showLoginError(msg){ const e=$("loginError"); e.textContent=msg; e.classList.remove("hidden"); }
function hideLoginError(){ $("loginError").classList.add("hidden"); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }

function phoneToEmail(phone){ return (phone||"").replace(/\D/g,"") + "@" + CONFIG.LOGIN_DOMAIN; }

$("loginBtn").addEventListener("click", async ()=>{
  hideLoginError();
  const phone=$("loginPhone").value.trim(), pass=$("loginPass").value;
  if(!phone||!pass){ showLoginError("Enter the phone number and password."); return; }
  $("loginBtn").textContent="Signing in…"; $("loginBtn").disabled=true;
  try{
    const { error } = await sb.auth.signInWithPassword({ email:phoneToEmail(phone), password:pass });
    if(error) throw error;
    showApp();
  }catch(err){ showLoginError("Sign-in failed. Check the phone number and password."); }
  finally{ $("loginBtn").textContent="Sign in"; $("loginBtn").disabled=false; }
});
$("loginPass").addEventListener("keydown", e=>{ if(e.key==="Enter") $("loginBtn").click(); });

$("logoutBtn").addEventListener("click", async ()=>{ await sb.auth.signOut(); $("loginPhone").value=""; $("loginPass").value=""; showLogin(); });

let searchTimer;
$("searchInput").addEventListener("input",(e)=>{ clearTimeout(searchTimer); const term=e.target.value.trim(); searchTimer=setTimeout(()=>runSearch(term),220); });

async function runSearch(term){
  const box=$("results");
  if(!term){ box.innerHTML=""; return; }
  box.innerHTML='<div class="spin">Searching…</div>';
  try{
    const like="%"+term+"%";
    const { data, error } = await sb.from("customers").select("*")
      .or(`first_name.ilike.${like},last_name.ilike.${like},phone.ilike.${like}`)
      .order("first_name",{ascending:true}).limit(25);
    if(error) throw error;
    renderResults(data, term);
  }catch(err){ box.innerHTML='<div class="errbox">Could not search. '+(err.message||"")+'</div>'; }
}

function fullName(c){ return (c.first_name + (c.last_name?" "+c.last_name:"")).trim(); }

function renderResults(list, term){
  const box=$("results");
  if(!list.length){
    box.innerHTML='<div class="empty">No customer found for “<strong>'+escapeHtml(term)+'</strong>”.<br><br>'+
      '<button class="btn btn-sage btn-sm" id="emptyAdd">+ Add “'+escapeHtml(term)+'”</button></div>';
    $("emptyAdd").addEventListener("click",()=>openAdd(term));
    return;
  }
  box.innerHTML=list.map(c=>{
    const ready=c.stamps>=CONFIG.STAMPS_FOR_REWARD;
    const pill=ready?'<span class="pill ready">Reward ready 🎉</span>':'<span class="pill">'+c.stamps+'/'+CONFIG.STAMPS_FOR_REWARD+' stamps</span>';
    return '<div class="result" data-id="'+c.id+'"><div class="who"><span class="nm">'+escapeHtml(fullName(c))+'</span>'+
           (c.phone?'<span class="ph">'+escapeHtml(c.phone)+'</span>':'')+'</div>'+pill+'</div>';
  }).join("");
  box.querySelectorAll(".result").forEach(el=>el.addEventListener("click",()=>openCustomer(el.dataset.id)));
}

$("addOpenBtn").addEventListener("click",()=>openAdd($("searchInput").value.trim()));
$("addBack").addEventListener("click",goSearch);

function openAdd(prefillFirst){
  $("addError").classList.add("hidden");
  $("addFirst").value=prefillFirst||""; $("addLast").value=""; $("addPhone").value="";
  goAdd(); $("addFirst").focus();
}

$("addSaveBtn").addEventListener("click", async ()=>{
  const first=$("addFirst").value.trim(), last=$("addLast").value.trim(), phone=$("addPhone").value.trim();
  const err=$("addError");
  if(!first){ err.textContent="First name is required."; err.classList.remove("hidden"); return; }
  err.classList.add("hidden"); $("addSaveBtn").disabled=true; $("addSaveBtn").textContent="Saving…";
  try{
    const { data, error } = await sb.from("customers").insert({ first_name:first, last_name:last||null, phone:phone||null }).select().single();
    if(error) throw error;
    toast("Customer added"); openCustomer(data.id, data);
  }catch(e){ err.textContent="Could not save. "+(e.message||""); err.classList.remove("hidden"); }
  finally{ $("addSaveBtn").disabled=false; $("addSaveBtn").textContent="Save customer"; }
});

$("custBack").addEventListener("click",()=>{ current=null; goSearch(); runSearch($("searchInput").value.trim()); });

async function openCustomer(id, preloaded){
  goCust(); $("custBody").innerHTML='<div class="spin">Loading…</div>';
  try{
    let c=preloaded;
    if(!c){ const { data, error } = await sb.from("customers").select("*").eq("id",id).single(); if(error) throw error; c=data; }
    current=c; renderCustomer();
  }catch(e){ $("custBody").innerHTML='<div class="errbox">Could not load customer. '+(e.message||"")+'</div>'; }
}

/* ---- date helpers ---- */
function stampDates(c){ return Array.isArray(c.stamp_dates) ? c.stamp_dates : []; }
function fmtLong(iso){ const d=new Date(iso); return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}); }
function fmtShort(iso){ const d=new Date(iso); return d.getDate()+'/'+(d.getMonth()+1); }
function relDays(iso){
  const t=new Date(iso), n=new Date();
  const a=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());
  const b=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
  const diff=Math.round((b-a)/86400000);
  if(diff<=0) return 'today';
  if(diff===1) return 'yesterday';
  return diff+' days ago';
}

function renderCustomer(){
  const c=current, N=CONFIG.STAMPS_FOR_REWARD, ready=c.stamps>=N;
  const dates=stampDates(c);

  // last-visit summary
  let lastVisit;
  if(dates.length){
    const last=dates[dates.length-1];
    lastVisit='<div class="last-visit">Last visit: <b>'+fmtLong(last)+'</b> · '+relDays(last)+'</div>';
  }else{
    lastVisit='<div class="last-visit muted">No visits recorded yet</div>';
  }

  // stamp grid — each filled stamp shows the date it was ticked
  let stamps='<div class="stamps">';
  for(let i=1;i<=N;i++){
    const filled=i<=c.stamps, tenth=(i===N), d=dates[i-1];
    const icon=filled?(tenth?'★':CONFIG.STAMP_ICON):'<span class="num">'+i+'</span>';
    const cap=(filled&&d)?fmtShort(d):'';
    const title=(filled&&d)?fmtLong(d):'';
    stamps+='<div class="stamp-cell">'+
              '<div class="stamp'+(filled?' filled':'')+(tenth?' tenth':'')+'" data-i="'+i+'" title="'+title+'">'+icon+'</div>'+
              '<div class="stamp-date">'+cap+'</div>'+
            '</div>';
  }
  stamps+='</div>';

  const rewardBanner=ready?('<div class="reward"><h3>Reward unlocked</h3>'+
    '<p>'+escapeHtml(CONFIG.REWARD_LABEL)+' — apply it, then start a fresh card.</p>'+
    '<button class="btn" id="redeemBtn">Apply '+escapeHtml(CONFIG.REWARD_LABEL)+' &amp; reset</button></div>'):'';

  $("custBody").innerHTML='<div class="panel"><h2 class="cust-name">'+escapeHtml(fullName(c))+'</h2>'+
    (c.phone?'<div class="cust-phone">'+escapeHtml(c.phone)+'</div>':'')+
    '<div class="cust-meta">Lifetime visits: '+c.total_visits+' · Rewards redeemed: '+c.rewards_redeemed+'</div>'+
    lastVisit+
    rewardBanner+stamps+
    '<div class="count-line"><b>'+c.stamps+'</b> / '+N+' stamps'+(ready?'':' · '+(N-c.stamps)+' to go')+'</div>'+
    (ready?'':'<div class="stamp-actions"><button class="btn btn-ghost btn-sm" id="undoBtn"'+(c.stamps===0?' disabled style="opacity:.5"':'')+'>Undo last</button>'+
      '<button class="btn btn-primary" id="addStampBtn">+ Add stamp</button></div>')+'</div>';

  $("custBody").querySelectorAll(".stamp").forEach(el=>el.addEventListener("click",()=>{ const i=parseInt(el.dataset.i,10); if(i>current.stamps) setStamps(i); }));
  const addBtn=$("addStampBtn"); if(addBtn) addBtn.addEventListener("click",()=>setStamps(Math.min(current.stamps+1,N)));
  const undoBtn=$("undoBtn"); if(undoBtn) undoBtn.addEventListener("click",()=>{ if(current.stamps>0) setStamps(current.stamps-1); });
  const redeem=$("redeemBtn"); if(redeem) redeem.addEventListener("click",redeemReward);
}

async function setStamps(n){
  const added=n-current.stamps;
  let dates=stampDates(current).slice();
  if(added>0){ const nowIso=new Date().toISOString(); for(let k=0;k<added;k++) dates.push(nowIso); }
  else if(added<0){ dates=dates.slice(0, Math.max(0, dates.length+added)); }
  const payload={ stamps:n, stamp_dates:dates, updated_at:new Date().toISOString() };
  if(added>0) payload.total_visits=current.total_visits+added;
  try{
    const { data, error } = await sb.from("customers").update(payload).eq("id",current.id).select().single();
    if(error) throw error;
    current=data; renderCustomer();
    if(n>=CONFIG.STAMPS_FOR_REWARD && added>0) toast("Card full — reward ready!");
  }catch(e){ toast("Couldn't save — try again"); }
}

async function redeemReward(){
  try{
    const { data, error } = await sb.from("customers")
      .update({ stamps:0, stamp_dates:[], rewards_redeemed:current.rewards_redeemed+1, updated_at:new Date().toISOString() })
      .eq("id",current.id).select().single();
    if(error) throw error;
    current=data; renderCustomer(); toast(CONFIG.REWARD_LABEL+" applied 🎉");
  }catch(e){ toast("Couldn't redeem — try again"); }
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

boot();
</script>
</body>
